<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starry Night Welcome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000; /* Black background */
            overflow: hidden; /* Hide scrollbars if stars extend beyond view */
            position: relative; /* Needed for pseudo-elements positioning */
        }

        /* Starry background - Layer 1 (small stars) */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            box-shadow: 
                /* Generate many random stars - example pattern */
                10px 10px 0 #FFF, 50px 30px 0 #FFF, 80px 10px 0 #FFF, 120px 40px 0 #FFF, 150px 20px 0 #FFF,
                180px 50px 0 #FFF, 210px 10px 0 #FFF, 240px 30px 0 #FFF, 270px 60px 0 #FFF, 300px 40px 0 #FFF,
                330px 10px 0 #FFF, 360px 20px 0 #FFF, 390px 50px 0 #FFF, 420px 30px 0 #FFF, 450px 10px 0 #FFF,
                480px 40px 0 #FFF, 510px 20px 0 #FFF, 540px 50px 0 #FFF, 570px 30px 0 #FFF, 600px 10px 0 #FFF,
                630px 40px 0 #FFF, 660px 20px 0 #FFF, 690px 50px 0 #FFF, 720px 30px 0 #FFF, 750px 10px 0 #FFF,
                780px 40px 0 #FFF, 810px 20px 0 #FFF, 840px 50px 0 #FFF, 870px 30px 0 #FFF, 900px 10px 0 #FFF,
                930px 40px 0 #FFF, 960px 20px 0 #FFF, 990px 50px 0 #FFF, 1020px 30px 0 #FFF, 1050px 10px 0 #FFF;
            animation: move-stars 200s linear infinite; /* Adjust duration for slower movement */
        }

        /* Starry background - Layer 2 (medium stars) */
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            box-shadow: 
                /* Another set of stars */
                25px 25px 0 2px #FFF, 75px 55px 0 2px #FFF, 105px 35px 0 2px #FFF, 145px 65px 0 2px #FFF, 175px 45px 0 2px #FFF,
                205px 75px 0 2px #FFF, 235px 35px 0 2px #FFF, 265px 55px 0 2px #FFF, 295px 85px 0 2px #FFF, 325px 65px 0 2px #FFF,
                355px 35px 0 2px #FFF, 385px 45px 0 2px #FFF, 415px 75px 0 2px #FFF, 445px 55px 0 2px #FFF, 475px 35px 0 2px #FFF,
                505px 65px 0 2px #FFF, 535px 45px 0 2px #FFF, 565px 75px 0 2px #FFF, 595px 55px 0 2px #FFF, 625px 35px 0 2px #FFF,
                655px 65px 0 2px #FFF, 685px 45px 0 2px #FFF, 715px 75px 0 2px #FFF, 745px 55px 0 2px #FFF, 775px 35px 0 2px #FFF,
                805px 65px 0 2px #FFF, 835px 45px 0 2px #FFF, 865px 75px 0 2px #FFF, 895px 55px 0 2px #FFF, 925px 35px 0 2px #FFF,
                955px 65px 0 2px #FFF, 985px 45px 0 2px #FFF, 1015px 75px 0 2px #FFF, 1045px 55px 0 2px #FFF, 1075px 35px 0 2px #FFF;
            animation: move-stars 300s linear infinite reverse; /* Slower and reverse movement */
        }

        @keyframes move-stars {
            from { transform: translateY(0); }
            to { transform: translateY(-2000px); /* Adjust based on desired star field height */ }
        }

        button {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            background-color: #000; /* Black button */
            color: white; /* White text */
            border: 2px solid #FFF; /* White border for contrast */
            border-radius: 5px;
            transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease; /* Smooth transition */
            z-index: 10; /* Ensure button is above stars */
        }

        button:hover {
            background-color: #FFF; /* Animate to white background */
            color: #000; /* Animate text to black */
            border-color: #000; /* Animate border to black */
        }
    </style>
</head>
<body>
    <button id="welcomeButton">Click Me!</button>

    <script>
        document.getElementById('welcomeButton').addEventListener('click', function() {
            alert('Welcome!');
        });
    </script>
</body>
</html>
